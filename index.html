<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดเก็บข้อมูล กองช่างเทศบาล</title>
    <!-- โหลด Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .form-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #imagePreview { max-width: 100%; height: auto; display: none; margin-top: 15px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 form-container">
            <h3 class="text-center mb-4 text-primary">📝 บันทึกข้อมูลงาน กองช่างเทศบาล</h3>
            
            <!-- ฟอร์มสำหรับส่งข้อมูลไปยัง backend (upload.php) -->
            <form action="upload.php" method="POST" enctype="multipart/form-data">
                
                <div class="mb-3">
                    <label for="title" class="form-label">หัวข้องาน / เรื่องที่ดำเนินการ</label>
                    <input type="text" class="form-control" id="title" name="title" required placeholder="เช่น ซ่อมไฟถนน, เทคอนกรีตซอย 1">
                </div>

                <div class="mb-3">
                    <label for="location" class="form-label">สถานที่ปฏิบัติงาน</label>
                    <input type="text" class="form-control" id="location" name="location" required placeholder="ระบุหมู่บ้าน, ซอย, หรือจุดสังเกต">
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">รายละเอียดการปฏิบัติงาน</label>
                    <textarea class="form-control" id="description" name="description" rows="3" required placeholder="อธิบายรายละเอียดงานที่ทำ..."></textarea>
                </div>

                <div class="mb-3">
                    <label for="work_image" class="form-label">อัปโหลดรูปภาพประกอบ</label>
                    <!-- รับเฉพาะไฟล์ภาพ -->
                    <input class="form-control" type="file" id="work_image" name="work_image" accept="image/*" required onchange="previewImage(event)">
                    
                    <!-- พื้นที่แสดงรูปภาพตัวอย่างก่อนอัปโหลด -->
                    <img id="imagePreview" src="#" alt="ตัวอย่างรูปภาพ" />
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">💾 บันทึกข้อมูล</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- JavaScript สำหรับแสดงรูปตัวอย่างก่อนกดเซฟ -->
<script>
    function previewImage(event) {
        var reader = new FileReader();
        reader.onload = function(){
            var output = document.getElementById('imagePreview');
            output.src = reader.result;
            output.style.display = 'block';
        };
        reader.readAsDataURL(event.target.files[0]);
    }
</script>

</body>
</html>
