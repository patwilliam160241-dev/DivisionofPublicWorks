<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดเก็บข้อมูล & ไฟล์งาน (Supabase)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden">

    <!-- ================= หน้า Login ================= -->
    <div id="loginPage" class="flex items-center justify-center h-full bg-gradient-to-br from-indigo-500 to-purple-600 absolute inset-0 z-50 transition-opacity duration-300">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md text-center">
            <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-folder-open text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">ระบบหลังบ้าน</h2>
            <p class="text-slate-500 mb-6">กรุณาใส่รหัสผ่านเพื่อเข้าสู่ระบบจัดเก็บไฟล์</p>
            
            <div class="mb-4 text-left">
                <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน</label>
                <input type="password" id="passwordInput" placeholder="กรอกรหัสผ่าน..." 
                       class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors">
            </div>
            <p id="errorMsg" class="text-red-500 text-sm mb-4 hidden">รหัสผ่านไม่ถูกต้อง!</p>
            <button onclick="checkPassword()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg transition-colors shadow-lg">
                เข้าสู่ระบบ
            </button>
        </div>
    </div>

    <!-- ================= หน้า Dashboard ================= -->
    <div id="dashboardPage" class="hidden flex h-full">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col">
            <div class="h-16 flex items-center px-6 border-b border-slate-800">
                <i class="fa-solid fa-cloud text-indigo-400 text-xl mr-3"></i>
                <span class="text-white font-bold text-lg">CloudStorage</span>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" class="flex items-center px-4 py-3 bg-indigo-600 text-white rounded-lg"><i class="fa-solid fa-file w-6"></i> ไฟล์ทั้งหมด</a>
            </nav>
            <div class="p-4 border-t border-slate-800">
                <button onclick="logout()" class="flex items-center px-4 py-2 w-full hover:bg-red-500 hover:text-white rounded-lg transition-colors text-slate-400">
                    <i class="fa-solid fa-right-from-bracket w-6"></i> ออกจากระบบ
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-full overflow-hidden">
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 shadow-sm">
                <h1 class="text-xl font-semibold text-slate-800">ระบบจัดการไฟล์งาน</h1>
            </header>

            <div class="flex-1 overflow-auto p-8">
                <!-- สรุปข้อมูล -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center">
                        <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center text-xl mr-4"><i class="fa-solid fa-file-lines"></i></div>
                        <div>
                            <p class="text-sm text-slate-500">ไฟล์ทั้งหมด</p>
                            <p id="totalFilesCount" class="text-2xl font-bold">0 ไฟล์</p>
                        </div>
                    </div>
                </div>

                <!-- อัปโหลดไฟล์ -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 mb-8">
                    <h2 class="text-lg font-semibold mb-4">อัปโหลดไฟล์ใหม่</h2>
                    <!-- ซ่อน input file ไว้ แล้วใช้ div เป็นปุ่มกดแทน -->
                    <input type="file" id="fileInput" class="hidden" onchange="uploadFile(event)">
                    <div onclick="document.getElementById('fileInput').click()" id="uploadBox" class="border-2 border-dashed border-slate-300 rounded-xl p-10 text-center hover:bg-slate-50 hover:border-indigo-400 transition-colors cursor-pointer relative">
                        <i id="uploadIcon" class="fa-solid fa-cloud-arrow-up text-4xl text-indigo-300 mb-3"></i>
                        <p id="uploadText" class="text-slate-600 font-medium">คลิกเพื่อเลือกไฟล์อัปโหลด</p>
                        <p id="uploadSubText" class="text-sm text-slate-400 mt-1">อัปโหลดเข้าสู่ Supabase Storage</p>
                    </div>
                </div>

                <!-- ตารางไฟล์ -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                        <h2 class="text-lg font-semibold">ไฟล์งานล่าสุด</h2>
                        <button onclick="fetchFiles()" class="text-sm bg-slate-100 hover:bg-slate-200 px-3 py-1 rounded text-slate-600"><i class="fa-solid fa-rotate-right"></i> รีเฟรช</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-slate-500 text-sm border-b border-slate-200">
                                    <th class="py-3 px-6 font-medium">ชื่อไฟล์</th>
                                    <th class="py-3 px-6 font-medium">ขนาด</th>
                                    <th class="py-3 px-6 font-medium">วันที่อัปโหลด</th>
                                    <th class="py-3 px-6 font-medium text-center">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody id="fileTableBody" class="text-sm divide-y divide-slate-100">
                                <tr><td colspan="4" class="text-center py-4 text-slate-400">กำลังโหลดข้อมูล...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script>
        // =================ตั้งค่า Supabase=================
        let supabaseClient = null;
        try {
            const supabaseUrl = 'https://cfmmjocjgznjtrmdhtrq.supabase.co';
            const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmbW1qb2NqZ3puanRybWRodHJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MzUwOTEsImV4cCI6MjEwMjUxMTA5MX0.WSVttUmOoMEMEIMs354bKDz4uGDK6JmNr09twxnuXDc';
            supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        } catch (err) {
            console.error("ไม่สามารถเริ่มต้น Supabase ได้:", err);
            alert("ระบบฐานข้อมูลโหลดไม่สำเร็จ กรุณารีเฟรชหน้าเว็บอีกครั้ง");
        }
        // ==================================================

        // 1. ระบบ Login (รหัส 8888)
        document.getElementById('passwordInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                checkPassword();
            }
        });

        function checkPassword() {
            const pwd = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (pwd === '8888') {
                errorMsg.classList.add('hidden');
                document.getElementById('loginPage').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loginPage').classList.add('hidden');
                    document.getElementById('dashboardPage').classList.remove('hidden');
                    if(supabaseClient) fetchFiles(); // ดึงข้อมูลไฟล์เมื่อเข้าสู่ระบบสำเร็จ
                }, 300);
            } else {
                errorMsg.innerText = "รหัสผ่านไม่ถูกต้อง! ลองใหม่อีกครั้ง";
                errorMsg.classList.remove('hidden');
            }
        }

        function logout() {
            document.getElementById('passwordInput').value = '';
            document.getElementById('dashboardPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
            setTimeout(() => document.getElementById('loginPage').style.opacity = '1', 50);
        }

        // 2. ฟังก์ชันแปลงขนาดไฟล์
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 3. ฟังก์ชันดึงข้อมูลไฟล์
        async function fetchFiles() {
            if (!supabaseClient) return;
            const tbody = document.getElementById('fileTableBody');
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i> กำลังโหลด...</td></tr>';

            try {
                const { data, error } = await supabaseClient
                    .from('files')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                document.getElementById('totalFilesCount').innerText = `${data.length} ไฟล์`;
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-slate-400">ยังไม่มีไฟล์ในระบบ</td></tr>';
                    return;
                }

                data.forEach(file => {
                    const date = new Date(file.created_at).toLocaleDateString('th-TH');
                    
                    let iconClass = 'fa-file text-slate-500';
                    if(file.file_name.endsWith('.pdf')) iconClass = 'fa-file-pdf text-red-500';
                    else if(file.file_name.match(/\.(jpg|jpeg|png|gif)$/i)) iconClass = 'fa-file-image text-green-500';
                    else if(file.file_name.match(/\.(doc|docx|xls|xlsx)$/i)) iconClass = 'fa-file-word text-blue-500';

                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 transition-colors';
                    tr.innerHTML = `
                        <td class="py-3 px-6 flex items-center">
                            <i class="fa-solid ${iconClass} text-lg mr-3"></i> 
                            <span class="truncate max-w-[200px] sm:max-w-xs">${file.file_name}</span>
                        </td>
                        <td class="py-3 px-6 text-slate-500">${formatBytes(file.file_size)}</td>
                        <td class="py-3 px-6 text-slate-500">${date}</td>
                        <td class="py-3 px-6 text-center space-x-2">
                            <a href="${file.file_url}" target="_blank" class="text-indigo-500 hover:text-indigo-700 p-2"><i class="fa-solid fa-download"></i></a>
                            <button onclick="deleteFile('${file.id}', '${file.file_name}')" class="text-red-500 hover:text-red-700 p-2"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error('Error fetching data:', err);
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-red-500">เกิดข้อผิดพลาดในการดึงข้อมูล โปรดตรวจสอบ Database</td></tr>';
            }
        }

        // 4. ฟังก์ชันอัปโหลดไฟล์ (แก้ไขรองรับภาษาไทย)
        async function uploadFile(event) {
            if (!supabaseClient) return alert('ระบบฐานข้อมูลยังไม่พร้อมใช้งาน');
            
            const file = event.target.files[0];
            if (!file) return;

            const icon = document.getElementById('uploadIcon');
            const text = document.getElementById('uploadText');
            
            icon.className = 'fa-solid fa-spinner fa-spin text-4xl text-indigo-500 mb-3';
            text.innerText = `กำลังอัปโหลด ${file.name}...`;

            // ==========================================
            // สร้างชื่อไฟล์ใหม่ให้ปลอดภัยกับ Storage (ตัวเลข + สุ่ม)
            // ==========================================
            const fileExt = file.name.split('.').pop();
            const randomString = Math.random().toString(36).substring(2, 10);
            const safeStorageName = `${Date.now()}_${randomString}.${fileExt}`;

            try {
                // อัปโหลดเข้า Storage ด้วยชื่อภาษาอังกฤษที่ปลอดภัย
                const { data: storageData, error: storageError } = await supabaseClient.storage
                    .from('uploads')
                    .upload(safeStorageName, file);

                if (storageError) throw storageError;

                // ดึง URL กลับมา
                const { data: urlData } = supabaseClient.storage
                    .from('uploads')
                    .getPublicUrl(safeStorageName);

                // บันทึกลงตาราง SQL โดยใช้ชื่อภาษาไทยต้นฉบับให้ผู้ใช้เห็น
                const { error: dbError } = await supabaseClient
                    .from('files')
                    .insert([
                        { 
                            file_name: file.name, 
                            file_size: file.size, 
                            file_url: urlData.publicUrl 
                        }
                    ]);

                if (dbError) throw dbError;

                alert('อัปโหลดไฟล์สำเร็จ!');
                fetchFiles(); 

            } catch (error) {
                console.error(error);
                alert('เกิดข้อผิดพลาดในการอัปโหลด: ' + error.message);
            } finally {
                icon.className = 'fa-solid fa-cloud-arrow-up text-4xl text-indigo-300 mb-3';
                text.innerText = 'คลิกเพื่อเลือกไฟล์อัปโหลด';
                document.getElementById('fileInput').value = ''; 
            }
        }

        // 5. ฟังก์ชันลบไฟล์
        async function deleteFile(id, fileName) {
            if (!confirm(`คุณต้องการลบไฟล์ "${fileName}" ใช่หรือไม่?`)) return;

            try {
                const { error: dbError } = await supabaseClient
                    .from('files')
                    .delete()
                    .eq('id', id);

                if (dbError) throw dbError;

                alert('ลบไฟล์สำเร็จแล้ว');
                fetchFiles(); 
            } catch (error) {
                console.error(error);
                alert('เกิดข้อผิดพลาดในการลบ: ' + error.message);
            }
        }
    </script>
</body>
</html>
